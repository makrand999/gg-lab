name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Drawing corpus
        run: node tools/edc.js --corpus --require-expect
      - name: Kernel modules load
        run: |
          node -e "['educad-predicates','educad-surfaces','educad-entities','educad-saves','educad-reconstruct','educad-ref3d'].forEach(function (m) { require('./public/lib/' + m + '.js'); })"
      - name: Kernel API manifest
        run: node tools/check-api.js
