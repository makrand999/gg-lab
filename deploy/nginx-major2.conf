# Include inside the existing mitasia.in server block (ports 80 and 443).
# These locations add Major 2 while retaining the existing /major/ locations.

location = /major2 {
    return 301 /major2/;
}

location = /major2/api {
    return 301 /major2/api/;
}

location ^~ /major2/api/ {
    proxy_pass http://127.0.0.1:8124/api/;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /major2/ {
    root /root/major/gg-lab/public;
    index index.html;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
}
