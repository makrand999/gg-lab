          if (tutBusy) return;
          tutError = '';
          EduCADTutorial.back(tutStepper);
          renderTutorialPanel();
        });
        wire('tut-next', function () {
          if (tutBusy || EduCADTutorial.done(tutStepper)) return;
          tutBusy = true;
          renderTutorialPanel();
          var st = EduCADTutorial.current(tutStepper);
          execTutorialStep(st, function (ok, err) {
            tutBusy = false;
            tutError = ok ? '' : err;
            if (ok) EduCADTutorial.advance(tutStepper);
            if (ok && window.EduCADSaves && EduCADTutorial.done(tutStepper)) {
              // Lesson complete: record progress server-side (guests skip).
              window.EduCADSaves.recordProgress(tutLesson, {
                done: true, at: Date.now()
              }).catch(function () {});
            }
            renderTutorialPanel();
          });
        });
        wire('tut-restart', function () {
          if (tutBusy) return;
          tutError = '';
          tutRefs = [];
          EduCADTutorial.restart(tutStepper);
          renderTutorialPanel();
        });
        wire('tut-exit', function () {
          if (tutBusy) return;
          hideTutorialPanel();
          tutStepper = null;
        });
        var nx = document.getElementById('tut-next');
        if (nx && (tutBusy || EduCADTutorial.done(tutStepper))) nx.setAttribute('disabled', 'true');
        var bk = document.getElementById('tut-back');
        if (bk && (tutBusy || tutStepper.i === 0)) bk.setAttribute('disabled', 'true');
      }
      function tutLessonTitle() {
        return tutLesson === 'prism' ? 'Tutorial: Hex Prism' : 'Tutorial: Profile Square';
      }
      function startTutorial(which) {
        if (typeof EduCADTutorial === 'undefined') return;
        // Tutorials draw, so they always run in Edit.
        setSheetMode('edit');
        tutRefs = [];
        tutError = '';
        tutBusy = false;
        tutLesson = (which === 'prism') ? 'prism' : 'square';
        var script = (tutLesson === 'prism') ?
          EduCADTutorial.PRISM_SCRIPT : EduCADTutorial.SQUARE_SCRIPT;
        tutStepper = EduCADTutorial.createStepper(script);
        hideVerifyPanel();
        renderTutorialPanel();
      }

      // Check URL hash
      var hash = window.location.hash;
      if (hash === '#points') {
        loadDemo('points');
      } else if (hash === '#prism') {
        loadDemo('prism');
      } else if (hash === '#3view') {
        loadDemo('3view');
      } else if (hash === '#square') {
        loadDemo('square');
      } else if (hash === '#mesh') {
        loadDemo('line');
        EduCADCanvas.applyMenuAction(handle.canvasState, 'mesh');
        EduGraphicsCommon.syncMenuChecked(mount, handle.canvasState.showGrid);
        mount.menu.style.left = '380px';
        mount.menu.style.top = '220px';
        mount.menu.classList.add('open');
        renderLayer1();
      } else {
        loadDemo('line');
      }
      renderLayer1();

      // Full-screen 3D glass: the model floats on a transparent sheet
      // over the whole window (no widget box). The sheet edge is the
      // only zoom bound; middle-drag pans any part back into view. The
      // glass captures the mouse only in the wireframe aura (see the
      // window pointer/wheel routing above); everywhere else the 2D
      // sheet works exactly as before.
      if (typeof EduCADSolid !== 'undefined' &&
          typeof EduCADSolid.mountSolidGlass === 'function') {
        handle.solid = EduCADSolid.mountSolidGlass(container, {
          w: window.innerWidth, h: window.innerHeight, dpr: dpr
        });
      } else if (typeof EduCADSolid !== 'undefined') {
        handle.solid = EduCADSolid.mountSolidWidget(container, { size: 260 });
      }

      // Live 2D -> 3D bridge: every table change rebuilds the glass from
      // the current visible drawing, coalesced to one frame. 3D truth is
      // derived and ephemeral; nothing is stored on entities.
      if (handle.solid && typeof EduCADReconstruct !== 'undefined' &&
          typeof EduCADSolid.setGeometry === 'function') {
        (function () {
          var solid3d = handle.solid;
          var rebuildQueued = false;
          function rebuildSolid() {
            rebuildQueued = false;
            var res = EduCADReconstruct.reconstruct(
              handle.table.visibleEntities());
            if (res.status === 'ok') {
              EduCADSolid.setGeometry(solid3d, res.geometry);
            } else {
              EduCADSolid.setUnavailable(solid3d, res.reason, res.label);
            }
          }
          handle.rebuildSolid = rebuildSolid;
          handle.table.subscribe(function () {
            if (rebuildQueued) return;
            rebuildQueued = true;
            window.requestAnimationFrame(rebuildSolid);
          });
          rebuildSolid();
        })();
      }

      console.log('EduCAD Web App initialized successfully!');
    })();
  </script>

  <script>
    // Drawing saves UI: Save/Drawings buttons in the session bar plus
    // tutorial completion badges. Separate from the main app block: it
    // reaches the live sheet only via window.educadHandle. Guests stay
    // server-free (the module short-circuits without a token). Panel and
    // status styling is inline so no head CSS changes are needed.
    (function savesUI() {
      if (typeof window.EduCADSaves === 'undefined') return;
      var Saves = window.EduCADSaves;
      function $(id) { return document.getElementById(id); }
      function table() {
        var h = window.educadHandle;
        return (h && h.table) || null;
      }
      function fail(msg) {
        return function (err) {
          status(msg + (err && err.message ? ': ' + err.message : ''));
        };
      }

      var current = { id: null, title: '' };
      // Deep-link bridge: ?drawing= notes the open drawing so the next
      // Save updates it instead of posting a copy.
      window.educadNoteDrawing = function (id, title) {
        current.id = id;
        current.title = title || '';
      };
      var statusEl = $('save-status');
      function status(msg) { if (statusEl) statusEl.textContent = msg || ''; }
      if (statusEl) {
        statusEl.style.fontSize = '12px';
        statusEl.style.color = '#777';
        statusEl.style.marginLeft = '6px';
      }
      function stamp() {
        var d = new Date();
        function p(x) { return (x < 10 ? '0' : '') + x; }
        return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
      }
      // A cleared sheet is a new drawing: the next save POSTs instead of
      // overwriting (demos, tutorials, and Clear all clear first).
      var t0 = table();
      if (t0 && typeof t0.subscribe === 'function') {
        t0.subscribe(function (op) {
          if (op === 'clear') { current.id = null; current.title = ''; }
        });
      }

      var saveBtn = $('btn-save');
      if (saveBtn) saveBtn.addEventListener('click', function () {
        var s = Saves.currentSession();
        if (Saves.isGuest(s)) {
          status('Log in to save drawings (guest is local-only).');
          return;
        }
        var t = table();
        if (!t) { status('Sheet not ready.'); return; }
        var snap;
        try {
          snap = Saves.snapshotTable(t);
        } catch (err) {
          status('Snapshot failed.');
          return;
        }
        var fi = window.fetch.bind(window);
        if (current.id) {
          Saves.updateDrawing(fi, s, current.id, { data: snap }).then(function () {
            status('Saved ' + stamp());
          }, fail('Save failed'));
          return;
        }
        var title = window.prompt('Drawing title:', 'Untitled');
        if (title === null) return;
        Saves.createDrawing(fi, s, title || 'Untitled', snap).then(function (data) {
          current.id = data.id;
          current.title = title || 'Untitled';
          status('Saved ' + stamp());
        }, fail('Save failed'));
      });

      var panel = $('drawings-panel');
      function hidePanel() { if (panel) panel.hidden = true; }
      function fmtDate(ts) {
        try {
          return new Date(ts * 1000).toLocaleString();
        } catch (err) {
          return '';
        }
      }
      function renderList(items) {
        while (panel.firstChild) panel.removeChild(panel.firstChild);
        var head = document.createElement('div');
        head.className = 'cf-title';
        head.appendChild(document.createTextNode('My drawings '));
        var x = document.createElement('button');
        x.className = 'cf-link';
        x.type = 'button';
        x.textContent = '×';
        x.addEventListener('click', hidePanel);
        head.appendChild(x);
        panel.appendChild(head);
        if (!items.length) {
          var empty = document.createElement('div');
          empty.textContent = 'No saved drawings yet.';
          empty.style.marginTop = '6px';
          panel.appendChild(empty);
          return;
        }
        items.forEach(function (it) {
          var row = document.createElement('div');
          row.className = 'cf-row';
          var name = document.createElement('div');
          name.textContent = it.title || 'Untitled';
          name.className = 'cf-name';
          row.appendChild(name);
          var when = document.createElement('div');
          when.textContent = fmtDate(it.updated_at);
          when.className = 'cf-muted';
          row.appendChild(when);
          var load = document.createElement('button');
          load.className = 'demo-btn';
          load.type = 'button';
          load.textContent = 'Load';
          load.style.marginRight = '6px';
          load.addEventListener('click', function () { onLoad(it); });
          row.appendChild(load);
          var del = document.createElement('button');
          del.className = 'demo-btn';
          del.type = 'button';
          del.textContent = 'Delete';
          del.addEventListener('click', function () { onDelete(it); });
          row.appendChild(del);
          panel.appendChild(row);
        });
      }
      function onLoad(it) {
        var s = Saves.currentSession();
        if (Saves.isGuest(s)) { hidePanel(); return; }
        var t = table();
        if (!t || !window.EduCADEntities) { status('Sheet not ready.'); return; }
        Saves.getDrawing(window.fetch.bind(window), s, it.id).then(function (data) {
          var count = Saves.restoreTable(window.EduCADEntities, t, data.data);
          current.id = it.id;
          current.title = data.title || '';
          var h = window.educadHandle;
          if (h && h.sel && window.EduCADCanvas &&
              typeof window.EduCADCanvas.deselect === 'function') {
            try { window.EduCADCanvas.deselect(h.sel); } catch (err) {}
          }
          hidePanel();
          status('Loaded ' + count + ' entities ' + stamp());
        }, fail('Load failed'));
      }
      function onDelete(it) {
        if (!window.confirm('Delete "' + (it.title || 'Untitled') + '"?')) return;
        var s = Saves.currentSession();
        if (Saves.isGuest(s)) return;
        Saves.deleteDrawing(window.fetch.bind(window), s, it.id).then(function () {
          if (current.id === it.id) { current.id = null; current.title = ''; }
          refreshPanel();
        }, fail('Delete failed'));
      }
      function refreshPanel() {
        var s = Saves.currentSession();
        if (Saves.isGuest(s)) {
          status('Log in to open drawings (guest is local-only).');
          return;
        }
        panel.hidden = false;
        panel.textContent = 'Loading…';
        Saves.listDrawings(window.fetch.bind(window), s).then(function (data) {
          renderList(data.drawings || []);
        }, function (err) {
          panel.textContent = 'Load failed' +
            (err && err.message ? ': ' + err.message : '');
        });
      }
      var drawingsBtn = $('btn-drawings');
      if (drawingsBtn) drawingsBtn.addEventListener('click', function () {
        if (!panel) return;
        if (panel.hidden) refreshPanel();
        else hidePanel();
      });

      // Completion badges: lessons recorded done get a ✓ on their buttons.
      Saves.fetchProgress().then(function (r) {
        if (r.skipped) return;
        (r.progress || []).forEach(function (p) {
          if (!p || !p.state || p.state.done !== true) return;
          var b = p.lesson === 'prism' ? $('btn-tut-prism') :
            (p.lesson === 'square' ? $('btn-tut-square') : null);
          if (b && b.textContent.indexOf('✓') === -1) b.textContent += ' ✓';
        });
      }, function () {});
    })();
  </script>

  <script>
    // Question sets UI: teachers post coded sets, students solve by drawing
    // and submit, teachers inspect submissions on the sheet. Role-driven
    // panel; guests stay server-free. Form keys never leak to the canvas:
    // the window keydown handler drives rename/typed-distance, so the panel
    // swallows all key events (pointer events are already stopped by the
    // session bar). All server/user text goes through textContent.
    (function setsUI() {
      if (typeof window.EduCADSaves === 'undefined') return;
      var Saves = window.EduCADSaves;
      function $(id) { return document.getElementById(id); }
      function table() {
        var h = window.educadHandle;
        return (h && h.table) || null;
      }
      function fi() { return window.fetch.bind(window); }
      var statusEl = $('save-status');
      function status(msg) { if (statusEl) statusEl.textContent = msg || ''; }
      function stamp() {
        var d = new Date();
        function p(x) { return (x < 10 ? '0' : '') + x; }
        return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
      }
      function fail(msg) {
        return function (err) {
          status(msg + (err && err.message ? ': ' + err.message : ''));
        };
      }

      var panel = $('sets-panel');
      if (!panel) return;
      ['keydown', 'keyup', 'keypress'].forEach(function (t) {
        panel.addEventListener(t, function (e) { e.stopPropagation(); });
      });
      function hidePanel() { panel.hidden = true; }
      function hideDrawings() {
        var d = $('drawings-panel');
        if (d) d.hidden = true;
      }

      function el(tag, text, css, cls) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined && text !== null) e.textContent = text;
        if (css) {
          var st = e.style;
          Object.keys(css).forEach(function (k) { st[k] = css[k]; });
        }
        return e;
      }
      function btn(label, fn, opt) {
        var b = document.createElement('button');
        b.className = (opt && opt.link) ? 'cf-link' : 'demo-btn';
        b.type = 'button';
        b.textContent = label;
        if (opt && opt.marginRight) b.style.marginRight = opt.marginRight;
        b.addEventListener('click', fn);
        return b;
      }
      function textInput(placeholder, value) {
        var i = document.createElement('input');
        i.type = 'text';
        i.placeholder = placeholder || '';
        i.value = value || '';
        return i;
      }
      function areaInput(placeholder, rows) {
        var a = document.createElement('textarea');
        a.placeholder = placeholder || '';
        a.rows = rows || 2;
        return a;
      }
      function clearPanel() {
        while (panel.firstChild) panel.removeChild(panel.firstChild);
      }
      function header(titleText) {
        var head = el('div', null, null, 'cf-title');
        head.appendChild(document.createTextNode(titleText + ' '));
        head.appendChild(btn('×', hidePanel, { link: true }));
        panel.appendChild(head);
      }
      function fmtDate(ts) {
        try {
          return new Date(ts * 1000).toLocaleString();
        } catch (err) {
          return '';
        }
      }
      function deselectAll() {
        var h = window.educadHandle;
        if (h && h.sel && window.EduCADCanvas &&
            typeof window.EduCADCanvas.deselect === 'function') {
          try { window.EduCADCanvas.deselect(h.sel); } catch (err) {}
        }
      }
      // Restore a snapshot onto the live sheet (caller confirms first).
      function loadOntoSheet(data, what) {
        var t = table();
        if (!t || !window.EduCADEntities) {
          status('Sheet not ready.');
          return 0;
        }
        var count = Saves.restoreTable(window.EduCADEntities, t, data);
        deselectAll();
        status(what + ' (' + count + ' entities) ' + stamp());
        return count;
      }

      var draft = [];
      function isTeacherRole(s) {
        return s && (s.role === 'teacher' || s.role === 'academics');
      }

      // ---- teacher views ----
      function teacherHome(s) {
        clearPanel();
        header('Question sets');
        panel.appendChild(el('div', 'New set', { marginTop: '6px' }, 'cf-section'));
        var codeIn = textInput('Set code, e.g. geo-101');
        var titleIn = textInput('Title, e.g. Projections 1');
        panel.appendChild(codeIn);
        panel.appendChild(titleIn);
        var draftBox = el('div');
        panel.appendChild(draftBox);
        function renderDraft() {
          while (draftBox.firstChild) draftBox.removeChild(draftBox.firstChild);
          draft.forEach(function (q, i) {
            var row = el('div', null,
              null, 'cf-row');
            row.appendChild(el('div', 'Q' + (i + 1) + ': ' + q.prompt));
            if (q.hint) {
              row.appendChild(el('div', 'Hint: ' + q.hint,
                null, 'cf-muted'));
            }
            if (q.starter) {
              row.appendChild(el('div',
                'Starter: ' + (q.starter.entities || []).length + ' entities',
                null, 'cf-muted'));
            }
            if (q.model) {
              row.appendChild(el('div',
                'Model: ' + (q.model.entities || []).length + ' entities · auto-check ' +
                (q.check_enabled === false ? 'off' : 'on'),
                null, 'cf-muted'));
            }
            var rm = btn('Remove', function () {
              draft.splice(i, 1);
              renderDraft();
            });
            rm.style.marginTop = '4px';
            row.appendChild(rm);
            draftBox.appendChild(row);
          });
        }
        renderDraft();
        var promptIn = areaInput('Question prompt', 2);
        var hintIn = textInput('Hint (optional)');
        panel.appendChild(promptIn);
        panel.appendChild(hintIn);
        var starterWrap = el('label', null, { display: 'block', marginTop: '4px' });
        var starterBox = document.createElement('input');
        starterBox.type = 'checkbox';
        starterWrap.appendChild(starterBox);
        starterWrap.appendChild(
          document.createTextNode(' Attach current sheet as starter'));
        panel.appendChild(starterWrap);
        var modelWrap = el('label', null, { display: 'block', marginTop: '4px' });
        var modelBox = document.createElement('input');
        modelBox.type = 'checkbox';
        modelWrap.appendChild(modelBox);
        modelWrap.appendChild(
          document.createTextNode(' Attach current sheet as model answer (students never see it)'));
        panel.appendChild(modelWrap);
        var checkWrap = el('label', null, { display: 'block', marginTop: '4px' });
        var checkBox = document.createElement('input');
        checkBox.type = 'checkbox';
        checkBox.checked = true;
        checkWrap.appendChild(checkBox);
        checkWrap.appendChild(
          document.createTextNode(' Auto-check against the model (strict pass/fail)'));
        panel.appendChild(checkWrap);
        var bulkIn = areaInput('Bulk: one question per block, blank line between. "Hint:" lines become hints.', 3);
        panel.appendChild(bulkIn);
        function parseBulk(text) {
          var out = [];
          String(text || '').split(/\n\s*\n/).forEach(function (b) {
            var lines = b.split('\n').map(function (l) { return l.trim(); })
              .filter(function (l) { return l !== ''; });
            if (!lines.length) return;
            var prompt = [];
            var hint = '';
            lines.forEach(function (l) {
              var m = l.match(/^hint\s*:\s*(.*)$/i);
              if (m) hint = (hint ? hint + ' ' : '') + m[1].trim();
              else prompt.push(l);
            });
            var p = prompt.join(' ').trim();
            if (!p) return;
            var q = { prompt: p };
            if (hint) q.hint = hint;
            out.push(q);
          });
          return out;
        }
        var addRow = el('div', null, { marginTop: '6px' });
        addRow.appendChild(btn('Add all', function () {
          var qs = parseBulk(bulkIn.value);
          if (!qs.length) {
            status('No questions found in the bulk text.');
            return;
          }
          qs.forEach(function (q) { draft.push(q); });
          bulkIn.value = '';
          status(qs.length + ' question(s) added to the draft.');
          renderDraft();
        }, { marginRight: '6px' }));
        addRow.appendChild(btn('Add question', function () {
          var prompt = promptIn.value.trim();
          if (!prompt) {
            status('Question prompt cannot be empty.');
            return;
          }
          var q = { prompt: prompt };
          if (hintIn.value.trim()) q.hint = hintIn.value.trim();
          if (starterBox.checked) {
            var t = table();
            if (!t) {
              status('Sheet not ready.');
              return;
            }
            try {
              q.starter = Saves.snapshotTable(t);
            } catch (err) {
              status('Starter snapshot failed.');
              return;
            }
          }
          if (modelBox.checked) {
            var mt = table();
            if (!mt) {
              status('Sheet not ready.');
              return;
            }
            try {
              q.model = Saves.snapshotTable(mt);
              q.check_enabled = checkBox.checked;
            } catch (err) {
              status('Model snapshot failed.');
              return;
            }
          }
          draft.push(q);
          promptIn.value = '';
          hintIn.value = '';
          starterBox.checked = false;
          modelBox.checked = false;
          renderDraft();
        }, { marginRight: '6px' }));
        addRow.appendChild(btn('Create set', function () {
          var code = codeIn.value.trim();
          var title = titleIn.value.trim() || 'Untitled set';
          if (!draft.length) {
            status('Add at least one question first.');
            return;
          }
          Saves.createSet(fi(), s, code, title, draft).then(function (data) {
            draft = [];
            codeIn.value = '';
            titleIn.value = '';
            status('Set ' + data.code + ' posted ' + stamp());
            teacherHome(s);
          }, fail('Create failed'));
        }));
        panel.appendChild(addRow);
        panel.appendChild(el('div', 'My sets', null, 'cf-section'));
        var listBox = el('div', 'Loading…');
        panel.appendChild(listBox);
        Saves.listSets(fi(), s).then(function (data) {
          while (listBox.firstChild) listBox.removeChild(listBox.firstChild);
          var sets = data.sets || [];
          if (!sets.length) {
            listBox.appendChild(el('div', 'No sets yet.'));
            return;
          }
          sets.forEach(function (it) {
            var row = el('div', null,
              null, 'cf-row');
            row.appendChild(el('div', it.code + ' — ' + (it.title || 'Untitled'),
              null, 'cf-name'));
            row.appendChild(el('div',
              it.nquestions + ' question(s) · ' + fmtDate(it.created_at),
              null, 'cf-muted'));
            var br = el('div', null, { marginTop: '4px' });
            br.appendChild(btn('Open', function () {
              teacherSetDetail(s, it.code);
            }, { marginRight: '6px' }));
            br.appendChild(btn('Delete', function () {
              if (!window.confirm('Delete set "' + it.code +
                  '" and all its submissions?')) {
                return;
              }
              Saves.deleteSet(fi(), s, it.code).then(function () {
                status('Set ' + it.code + ' deleted.');
                teacherHome(s);
              }, fail('Delete failed'));
            }));
            row.appendChild(br);
            listBox.appendChild(row);
          });
        }, function (err) {
          listBox.textContent = 'Load failed' +
            (err && err.message ? ': ' + err.message : '');
        });
      }

      function teacherSetDetail(s, code) {
        clearPanel();
        header('Set ' + code);
        var back = btn('Back', function () { teacherHome(s); });
        back.style.margin = '6px 0';
        panel.appendChild(back);
        var body = el('div', 'Loading…');
        panel.appendChild(body);
        function verdictTag(v) {
          if (v === 'pass') return ' [PASS]';
          if (v === 'fail') return ' [FAIL]';
          return ' [ungraded]';
        }
        function autoTag(a) {
          if (!a || !a.checked) return ' auto: off';
          return a.pass ? ' auto: PASS' : ' auto: FAIL';
        }
        function gradeForm(row, sub, setCode) {
          var old = row.querySelector('.cf-gradeform');
          if (old) { row.removeChild(old); return; }
          var form = el('div', null, null, 'cf-gradeform');
          var sel = document.createElement('select');
          [['', 'Ungraded'], ['pass', 'Pass'], ['fail', 'Fail']].forEach(function (o) {
            var op = document.createElement('option');
            op.value = o[0];
            op.textContent = o[1];
            if ((sub.verdict || '') === o[0]) op.selected = true;
            sel.appendChild(op);
          });
          var rem = areaInput('Remarks for the student (optional)', 2);
          rem.value = sub.remarks || '';
          form.appendChild(sel);
          form.appendChild(rem);
          var brow = el('div', null, { marginTop: '4px' });
          brow.appendChild(btn('Save grade', function () {
            Saves.gradeSubmission(fi(), s, sub.id, sel.value, rem.value.trim())
              .then(function () {
                status('Submission #' + sub.id + ' graded ' + stamp());
                teacherSetDetail(s, setCode);
              }, fail('Grade failed'));
          }, { marginRight: '6px' }));
          brow.appendChild(btn('Cancel', function () { row.removeChild(form); }));
          form.appendChild(brow);
          row.appendChild(form);
        }
        Saves.getSet(fi(), s, code).then(function (data) {
          while (body.firstChild) body.removeChild(body.firstChild);
          body.appendChild(el('div', data.title || 'Untitled', null, 'cf-name'));
          (data.questions || []).forEach(function (q, i) {
            var qrow = el('div', null, null, 'cf-row');
            qrow.appendChild(el('div', 'Q' + (i + 1) + ': ' + q.prompt, null, 'cf-name'));
            var has = !!q.has_model;
            qrow.appendChild(el('div', has
              ? ('Model attached · auto-check ' + (q.check_enabled === false ? 'OFF' : 'ON'))
              : 'No model answer', null, 'cf-muted'));
            var qr = el('div', null, { marginTop: '4px' });
            qr.appendChild(btn('Model := sheet', function () {
              var t = table();
              if (!t) { status('Sheet not ready.'); return; }
              var snap;
              try { snap = Saves.snapshotTable(t); } catch (err) {
                status('Snapshot failed.');
                return;
              }
              Saves.setQuestionModel(fi(), s, code, i, snap).then(function () {
                status('Q' + (i + 1) + ' model attached ' + stamp());
                teacherSetDetail(s, code);
              }, fail('Attach failed'));
            }, { marginRight: '6px' }));
            if (has) {
              qr.appendChild(btn('View model', function () {
                try {
                  loadOntoSheet(q.model, 'Model loaded');
                  hidePanel();
                } catch (err) {
                  status('Model data is malformed.');
                }
              }, { marginRight: '6px' }));
              qr.appendChild(btn(q.check_enabled === false ? 'Check on' : 'Check off',
                (function (idx, cur) {
                  return function () {
                    Saves.setQuestionCheck(fi(), s, code, idx, cur === false)
                      .then(function () {
                        status('Q' + (idx + 1) + ' auto-check ' +
                          (cur === false ? 'on' : 'off') + ' ' + stamp());
                        teacherSetDetail(s, code);
                      }, fail('Toggle failed'));
                  };
                })(i, q.check_enabled), { marginRight: '6px' }));
              qr.appendChild(btn('Clear model', (function (idx) {
                return function () {
                  if (!window.confirm('Remove the model for Q' + (idx + 1) + '?')) return;
                  Saves.clearQuestionModel(fi(), s, code, idx).then(function () {
                    status('Q' + (idx + 1) + ' model cleared.');
                    teacherSetDetail(s, code);
                  }, fail('Clear failed'));
                };
              })(i)));
            }
            qrow.appendChild(qr);
            body.appendChild(qrow);
          });
          body.appendChild(el('div', 'Submissions by question', { marginTop: '8px' }, 'cf-section'));
          var sub = el('div', 'Loading…');
          body.appendChild(sub);
          Saves.listSubmissions(fi(), s, code).then(function (sd) {
            while (sub.firstChild) sub.removeChild(sub.firstChild);
            var items = sd.submissions || [];
            if (!items.length) {
              sub.appendChild(el('div', 'No submissions yet.'));
              return;
            }
            var groups = {};
            items.forEach(function (it) {
              var k = it.question_index;
              if (!groups[k]) groups[k] = [];
              groups[k].push(it);
            });
            Object.keys(groups).map(Number).sort(function (a, b) { return a - b; })
              .forEach(function (qi) {
                var list = groups[qi];
                sub.appendChild(el('div', 'Q' + (qi + 1) + ' — ' + list.length +
                  ' submission(s)', { marginTop: '6px' }, 'cf-section'));
                list.forEach(function (it) {
                  var row = el('div', null, null, 'cf-row');
                  row.appendChild(el('div',
                    (it.name || it.username) + verdictTag(it.verdict) + autoTag(it.auto),
                    null, 'cf-name'));
                  if (it.note) row.appendChild(el('div', 'Student note: ' + it.note));
                  if (it.remarks) row.appendChild(el('div', 'Remarks: ' + it.remarks));
                  row.appendChild(el('div', fmtDate(it.created_at), null, 'cf-muted'));
                  var br = el('div', null, { marginTop: '4px' });
                  br.appendChild(btn('Inspect on sheet', function () {
                    if (!window.confirm('Load this submission onto the sheet? ' +
                        'The current sheet will be replaced.')) {
                      return;
                    }
                    Saves.getSubmission(fi(), s, it.id).then(function (full) {
                      try {
                        loadOntoSheet(full.data, 'Submission loaded');
                        hidePanel();
                      } catch (err) {
                        status('Submission data is malformed.');
                      }
                    }, fail('Inspect failed'));
                  }, { marginRight: '6px' }));
                  br.appendChild(btn('Grade', function () {
                    gradeForm(row, it, code);
                  }));
                  row.appendChild(br);
                  sub.appendChild(row);
                });
              });
          }, function (err) {
            sub.textContent = 'Load failed' +
              (err && err.message ? ': ' + err.message : '');
          });
        }, fail('Load failed'));
      }

      // ---- student views ----
      function studentHome(s) {
        clearPanel();
        header('Question sets');
        panel.appendChild(el('div', 'Open a set by code', { marginTop: '6px' }, 'cf-section'));
        var codeIn = textInput('Set code, e.g. geo-101');
        panel.appendChild(codeIn);
        var open = btn('Open', function () {
          var code = codeIn.value.trim();
          if (!code) {
            status('Enter a set code first.');
            return;
          }
          studentSetDetail(s, code);
        });
        open.style.marginTop = '6px';
        panel.appendChild(open);
        panel.appendChild(el('div', 'My submissions', null, 'cf-section'));
        var mine = el('div', 'Loading…');
        panel.appendChild(mine);
        Saves.listMySubmissions(fi(), s).then(function (data) {
          while (mine.firstChild) mine.removeChild(mine.firstChild);
          var items = data.submissions || [];
          if (!items.length) {
            mine.appendChild(el('div', 'Nothing submitted yet.'));
            return;
          }
          items.forEach(function (it) {
            var row = el('div', null,
              null, 'cf-row');
            var tag = '';
            if (it.verdict === 'pass') tag = ' [PASS]';
            else if (it.verdict === 'fail') tag = ' [FAIL]';
            if (it.auto && it.auto.checked) tag += it.auto.pass ? ' auto: PASS' : ' auto: FAIL';
            row.appendChild(el('div',
              it.set_code + ' · Q' + (it.question_index + 1) + tag,
              null, 'cf-name'));
            if (it.remarks) row.appendChild(el('div', 'Teacher: ' + it.remarks));
            row.appendChild(el('div', fmtDate(it.created_at),
              null, 'cf-muted'));
            var rel = btn('Reload', function () {
              if (!window.confirm('Load your submission onto the sheet? ' +
                  'The current sheet will be replaced.')) {
                return;
              }
              Saves.getSubmission(fi(), s, it.id).then(function (full) {
                try {
                  loadOntoSheet(full.data, 'Submission loaded');
                  hidePanel();
                } catch (err) {
                  status('Submission data is malformed.');
                }
              }, fail('Reload failed'));
            });
            rel.style.marginTop = '4px';
            row.appendChild(rel);
            mine.appendChild(row);
          });
        }, function (err) {
          mine.textContent = 'Load failed' +
            (err && err.message ? ': ' + err.message : '');
        });
      }

      function studentSetDetail(s, code) {
        clearPanel();
        header('Set ' + code);
        var back = btn('Back', function () { studentHome(s); });
        back.style.margin = '6px 0';
        panel.appendChild(back);
        var body = el('div', 'Loading…');
        panel.appendChild(body);
        Saves.getSet(fi(), s, code).then(function (data) {
          while (body.firstChild) body.removeChild(body.firstChild);
          body.appendChild(el('div', data.title || 'Untitled', null, 'cf-name'));
          if (data.owner) {
            body.appendChild(el('div', 'By ' + data.owner,
              null, 'cf-muted'));
          }
          (data.questions || []).forEach(function (q, i) {
            var row = el('div', null,
              null, 'cf-row');
            row.appendChild(el('div', 'Q' + (i + 1) + ': ' + q.prompt,
              null, 'cf-name'));
            var checkNote = el('div', null, { marginTop: '2px' }, 'cf-muted');
            if (q.has_model && q.check_enabled !== false) {
              checkNote.textContent = 'Strict auto-check is on: Verify tells pass/fail only.';
            } else if (q.has_model) {
              checkNote.textContent = 'Auto-check is off for this question.';
            } else {
              checkNote.textContent = 'No auto-check for this question.';
            }
            row.appendChild(checkNote);
            var verdictLine = el('div', null, { marginTop: '2px' });
            verdictLine.hidden = true;
            row.appendChild(verdictLine);
            function showAuto(auto) {
              verdictLine.hidden = false;
              while (verdictLine.firstChild) verdictLine.removeChild(verdictLine.firstChild);
              if (!auto || !auto.checked) {
                verdictLine.textContent = 'Auto-check unavailable for this question.';
                return;
              }
              var d = auto.details || {};
              var msg = auto.pass ? 'AUTO-CHECK: PASS ✓' : 'AUTO-CHECK: FAIL ✗';
              if (d.matched !== undefined) {
                msg += ' — ' + d.matched + '/' + d.model_count + ' matched';
                if (d.missing) msg += ', ' + d.missing + ' missing';
                if (d.extra) msg += ', ' + d.extra + ' extra';
              }
              if (typeof auto.score === 'number') {
                msg += ' (score ' + Math.round(auto.score * 100) + '%)';
              }
              verdictLine.textContent = msg;
            }
            if (q.hint) {
              var hintBtn = btn('Hint', function () {
                hintText.hidden = !hintText.hidden;
              }, { link: true });
              hintBtn.style.marginTop = '4px';
              row.appendChild(hintBtn);
              var hintText = el('div', q.hint,
                { marginTop: '2px' }, 'cf-muted');
              hintText.hidden = true;
              row.appendChild(hintText);
            }
            var br = el('div', null, { marginTop: '4px' });
            if (q.starter) {
              br.appendChild(btn('Load starter', function () {
                if (!window.confirm('Load the starter onto the sheet? ' +
                    'The current sheet will be replaced.')) {
                  return;
                }
                try {
                  loadOntoSheet(q.starter, 'Starter loaded');
                } catch (err) {
                  status('Starter data is malformed.');
                }
              }, { marginRight: '6px' }));
            }
            if (q.has_model && q.check_enabled !== false) {
              br.appendChild(btn('Verify my sheet', function () {
                var t = table();
                if (!t) {
                  status('Sheet not ready.');
                  return;
                }
                var snap;
                try {
                  snap = Saves.snapshotTable(t);
                } catch (err) {
                  status('Snapshot failed.');
                  return;
                }
                status('Verifying Q' + (i + 1) + '…');
                Saves.verifySolution(fi(), s, code, i, snap).then(function (r) {
                  showAuto(r);
                  if (!r.checked) {
                    status('Q' + (i + 1) + ': auto-check unavailable.');
                  } else if (r.pass) {
                    status('Q' + (i + 1) + ': AUTO-CHECK PASS ✓ ' + stamp());
                  } else {
                    status('Q' + (i + 1) + ': AUTO-CHECK FAIL ✗ — ' +
                      'the model stays hidden; fix your drawing and verify again. ' +
                      stamp());
                  }
                }, fail('Verify failed'));
              }, { marginRight: '6px' }));
            }
            br.appendChild(btn('Submit my sheet', function () {
              var t = table();
              if (!t) {
                status('Sheet not ready.');
                return;
              }
              var snap;
              try {
                snap = Saves.snapshotTable(t);
              } catch (err) {
                status('Snapshot failed.');
                return;
              }
              var note = window.prompt('Note for your teacher (optional):', '');
              if (note === null) return;
              Saves.submitSolution(fi(), s, code, i, snap, note || '').then(function (r) {
                showAuto(r && r.auto);
                if (r && r.auto && r.auto.checked && !r.auto.pass) {
                  status('Submitted Q' + (i + 1) + ' — AUTO-CHECK FAIL ✗ ' + stamp());
                } else if (r && r.auto && r.auto.checked) {
                  status('Submitted Q' + (i + 1) + ' — AUTO-CHECK PASS ✓ ' + stamp());
                } else {
                  status('Submitted Q' + (i + 1) + ' ' + stamp());
                }
              }, fail('Submit failed'));
            }));
            row.appendChild(br);
            body.appendChild(row);
          });
        }, function (err) {
          body.textContent = (err && err.status === 404)
            ? 'No set with that code.'
            : 'Load failed' + (err && err.message ? ': ' + err.message : '');
        });
      }

      var setsBtn = $('btn-sets');
      if (setsBtn) setsBtn.addEventListener('click', function () {
        var s = Saves.currentSession();
        if (Saves.isGuest(s)) {
          status('Log in to use question sets (guest is local-only).');
          return;
        }
        if (!panel.hidden) {
          hidePanel();
          return;
        }
        hideDrawings();
        panel.hidden = false;
        if (isTeacherRole(s)) teacherHome(s);
        else studentHome(s);
      });
    })();
  </script>

  <script>
    // Deep links from the studio and workspace. ?submission=<id> reviews
    // a submission (teachers and academics land in read-only View mode,
    // students get an editable copy); ?solve=<code>&q=<i> loads a
    // question starter for solving; ?drawing=<id> opens a saved drawing;
    // ?model=<code>&q=<i> loads the model answer for editing (teachers
    // only — students never receive the model payload).
    // ?draw=1 is a bare sheet (lets teachers past the studio gate).
    (function deepLink() {
      if (typeof window.EduCADSaves === 'undefined') return;
      var Saves = window.EduCADSaves;
      function $(id) { return document.getElementById(id); }
      function params() {
        var out = {};
        var q = String(window.location.search || '').replace(/^\?/, '');
        q.split('&').forEach(function (kv) {
          if (!kv) return;
          var i = kv.indexOf('=');
          var k = i === -1 ? kv : kv.slice(0, i);
          var v = i === -1 ? '' : kv.slice(i + 1);
          try {
            out[decodeURIComponent(k)] = decodeURIComponent(v.replace(/\+/g, ' '));
          } catch (err) { /* keep going on bad escapes */ }
        });
        return out;
      }
      function table() {
        var h = window.educadHandle;
        return (h && h.table) || null;
      }
      function setMode(mode) {
        if (typeof window.educadSetSheetMode === 'function') {
          window.educadSetSheetMode(mode);
          return;
        }
        var b = $(mode === 'view' ? 'btn-mode-view' : 'btn-mode-edit');
        if (b && b.click) b.click();
      }
      var statusEl = $('save-status');
      function status(msg) { if (statusEl) statusEl.textContent = msg || ''; }
      function fmtDate(ts) {
        try { return new Date(ts * 1000).toLocaleString(); }
        catch (err) { return ''; }
      }
      function loadOntoSheet(data) {
        var t = table();
        if (!t || !window.EduCADEntities) {
          status('Sheet not ready.');
          return -1;
        }
        var count = Saves.restoreTable(window.EduCADEntities, t, data);
        var h = window.educadHandle;
        if (h && h.sel && window.EduCADCanvas &&
            typeof window.EduCADCanvas.deselect === 'function') {
          try { window.EduCADCanvas.deselect(h.sel); } catch (err) {}
        }
        return count;
      }

      var p = params();
      var s = Saves.currentSession();
      if (Saves.isGuest(s)) {
        if (p.submission || p.solve || p.drawing || p.model) {
          status('Log in to open shared sheets (guest is local-only).');
        }
        return;
      }
      var fi = window.fetch.bind(window);
      if (p.submission) {
        var id = parseInt(p.submission, 10);
        if (!(id > 0)) { status('Bad submission link.'); return; }
        Saves.getSubmission(fi, s, id).then(function (full) {
          var count;
          try {
            count = loadOntoSheet(full.data);
          } catch (err) {
            status('Submission data is malformed.');
            return;
          }
          if (count < 0) return;
          var label = (full.name || full.username || 'Submission') + ' · ' +
            (full.set_code || 'set') + ' Q' + ((full.question_index || 0) + 1);
          if (s.role === 'teacher' || s.role === 'academics') {
            setMode('view');
            status(label + ' · ' + fmtDate(full.created_at) + ' (view only)');
          } else {
            setMode('edit');
            status(label + ' loaded as an editable copy.');
          }
        }, function (err) {
          status('Submission failed to load' +
            (err && err.message ? ': ' + err.message : ''));
        });
        return;
      }
      if (p.solve) {
        var qi = parseInt(p.q || '0', 10);
        if (!(qi >= 0)) qi = 0;
        Saves.getSet(fi, s, p.solve).then(function (data) {
          var qs = data.questions || [];
          if (qi >= qs.length) { status('No such question.'); return; }
          var q = qs[qi];
          setMode('edit');
          if (q.starter) {
            var count;
            try {
              count = loadOntoSheet(q.starter);
            } catch (err) {
              status('Starter data is malformed.');
              return;
            }
            if (count < 0) return;
            status('Q' + (qi + 1) + ': ' + q.prompt + ' (starter loaded)');
          } else {
            status('Q' + (qi + 1) + ': ' + q.prompt);
          }
        }, function (err) {
          status('Set failed to load' +
            (err && err.message ? ': ' + err.message : ''));
        });
        return;
      }
      if (p.model) {
        if (s.role !== 'teacher' && s.role !== 'academics') {
          status('Model answers are hidden from students.');
          return;
        }
        var mqi = parseInt(p.q || '0', 10);
        if (!(mqi >= 0)) mqi = 0;
        Saves.getSet(fi, s, p.model).then(function (data) {
          var qs = data.questions || [];
          if (mqi >= qs.length || !qs[mqi].model) {
            status('No model answer for that question.');
            return;
          }
          var count;
          try {
            count = loadOntoSheet(qs[mqi].model);
          } catch (err) {
            status('Model data is malformed.');
            return;
          }
          if (count < 0) return;
          setMode('edit');
          status('Model for ' + p.model + ' Q' + (mqi + 1) +
            ' loaded as an editable copy (' + count + ' entities). ' +
            'Re-attach via the Sets panel to update it.');
        }, function (err) {
          status('Set failed to load' +
            (err && err.message ? ': ' + err.message : ''));
        });
        return;
      }
      if (p.drawing) {
        var did = parseInt(p.drawing, 10);
        if (!(did > 0)) { status('Bad drawing link.'); return; }
        Saves.getDrawing(fi, s, did).then(function (data) {
          var count;
          try {
            count = loadOntoSheet(data.data);
          } catch (err) {
            status('Drawing data is malformed.');
            return;
          }
          if (count < 0) return;
          if (typeof window.educadNoteDrawing === 'function') {
            window.educadNoteDrawing(data.id, data.title);
          }
          setMode('edit');
          status('Opened "' + (data.title || 'Untitled') + '" (' +
            count + ' entities)');
        }, function (err) {
          status('Drawing failed to load' +
            (err && err.message ? ': ' + err.message : ''));
        });
      }
    })();
  </script>
</body>
</html>
